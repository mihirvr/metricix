spring:
  application:
    name: metricix

  # 1. Non-Blocking PostgreSQL Connection
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/metricix_db
    username: metricix_admin
    password: super_secret_password_123

  # 2. Synchronous PostgreSQL Connection (Used ONLY by Flyway to build tables)
  flyway:
    url: jdbc:postgresql://localhost:5433/metricix_db
    user: metricix_admin
    password: super_secret_password_123
    enabled: true

  # 3. High-Performance Redis Connection with Pooling
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          enabled: true
          max-active: 100

# 4. "Silent Running" Mode - Suppress all logs except critical warnings
logging:
  level:
    root: WARN
    com.metricix: WARN